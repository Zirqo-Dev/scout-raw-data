name: test
# Code only. log.yml pushes a data commit every hour, and a suite that ran on
# each of them would test nothing that changed. Keep data/ out of this list.
on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/test.yml"

# Read-only, no secrets. The suite makes no network call and reads only
# tests/fixtures/.
permissions:
  contents: read

# An alarm, not a gate: it must never be able to block a data commit.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Test-only. The logger itself runs on the standard library.
        run: python -m pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests/ -q
